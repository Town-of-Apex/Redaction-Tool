services:
  redaction-tool:
    build: .
    container_name: redaction-tool
    restart: always
    ports:
      - "9004:8000"
    environment:
      - PORT=8000
      - FLASK_DEBUG=false
      - ENABLE_AUTO_REDACT=false
    # Use Dockerfile CMD (gunicorn). No source bind-mount.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
